[package]
name = "bioclean"
version = "2.0.0"
edition = "2021"
authors = ["Cleverson Matiolli, PhD <clever@aidbio.com>", "Gemini"]
description = "An Agentic System Orchestrator for High-Performance Linux Environments"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1.38", features = ["full"] }
colored = "2.1"
indicatif = { version = "0.17", features = ["rayon"] }
rayon = "1.10"
walkdir = "2.5"
sysinfo = "0.31"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
regex = "1.10"

[dev-dependencies]
tempfile = "3.10"
